# a service name becomes a hostname
services:
  mongo:
    # image means "don't build anything, pull this ready-made image"
    image: mongo:7
    # if the container stops unexpectedly, restart it
    # unless-stopped means "always restart, except when I stopped it deliberately"
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: lmcuong199/todo-api:latest
    # build this one from a Dockerfile in this folder
    build: .
    restart: unless-stopped
    #
    #ports:
    #  # "HOST:CONTAINER". Left is the port on Win, right is inside the container. Quote it
    #  - "3000:3000"
    #
    expose:
      - "3000"
    environment:
      - PORT=3000
      - MONGO_URL=mongodb://mongo:27017/todos
    depends_on:
      mongo:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    # a bind mount: a file from your project appears inside the container
    # :ro is read only - Nginx has no business modifying its own config
    # /etc/nginx/conf.d/ is where the default ngionx.conf looks for server blocks, so dropping a file there is all that's needed
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # start order only, no healthcheck needed
    depends_on:
      - api

# any named volume used above must also be declared here at thetop level. 
# the empty value means "default settings". It looks redundant; compose requires it
volumes:
  mongo-data:
