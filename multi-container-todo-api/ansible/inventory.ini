# A group. Groups let one playbook target many machines
# With 10 web servers you'd list 10 lines here and the playbook wouldn't change
[todo_servers]
# todo-server: the host's name in Ansible. Just a label
# ansible_host=localhost ansible_port=2222: where to actually connect. 
# This is Terraform's ansible_host output, and it's the seam: point these at a real droplet's IP and port 22, and everything else works untouched
# ansible_user=root: who to log in as
todo-server ansible_host=localhost ansible_port=2222 ansible_user=root

# settings applied to every host in the group
[todo_servers:vars]
# ansible_ssh_private_key_file: which key. Your private key stays in WSL and is only used locally to prove identity
ansible_ssh_private_key_file=~/.ssh/id_ed25519
# StrictHostKeyChecking=no: don't prompt about unknown hosts
# Necessary because your server gets recreated with new host keys whenever you terraform destroy/apply. 
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
# ansible_python_intepreter: where Python lived on the target. Setting it explicitly avoids a warning and a wrong guess
ansible_python_interpreter=/usr/bin/python3
