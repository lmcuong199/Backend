name: Todo API - build and push

# the trigger block
on:
  push:
    branches: [main]
    paths:
      # ** means any file at any depth below
      - 'multi-container-todo-api/**'
      # makes the workflow rerun when you edit the workflow itself 
      - '.github/workflows/todo-api.yml'
  # also run on pull requests, but PRs build without publishing
  pull_request:
    paths:
      - 'multi-container-todo-api/**'
  # adds a Run workflow button in GitHub's UI so you can trigger it by hand. 
  # Very useful for testing without making a commit
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build image and push to Docker Hub
    # ubuntu-latest is a fresh virtual machine GitHub creates for this job and destroys afterwards
    runs-on: ubuntu-latest

    steps:
      # downloads your code onto the runner
      # the runner starts with an empty disk - it does not have your repo by default
      - name: Check out the repository
      # @v4 pin the major version, same discipline as node:20-alpine
        uses: actions/checkout@v4

      # sets up Docker's advaced builder. You need it for the layer caching further down
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # if: line is essential for a public repo. 
        # GitHub deliberately withholds secrets from pull requests opened by forks - otherwise anyone could submit a PR that prints your token
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        # with: passes inputs to an action - like function arguments
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # context is the build context - the same thing as the trailing . in docker build -t todo-api .
          # It must point at your project subfolder, because checkout gave the runner the whole repo
          context: ./multi-container-todo-api
          # the safety line
          push: ${{ github.event_name != 'pull_request' }}
          # the | starts a multi-line string - one tag per line
          # ${{github.sha}} is the commit hash that triggered the run, 
          # so every deploy produces a uniquely tagged image like todo-api:a1b2c3d..., permanently tied to the exact commit that built it
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
